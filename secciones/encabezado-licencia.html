<!--
  Encabezado de la página /licencia-agente-de-seguros/
  Pegar completo dentro de un widget "HTML" de Elementor, ARRIBA del selector de estado.
  Reemplaza el título y el subtítulo actuales (bórralos para no tener dos títulos H1).
  Todo el CSS está limitado a .clc-encabezado, así que no afecta el resto del sitio.
-->
<section class="clc-encabezado">
<style>
.clc-encabezado{--azul:#4FB3E3;--texto:#1d2330;
  color:var(--texto);font-family:inherit;line-height:1.55;max-width:1200px;margin:0 auto;padding:8px 0 24px;text-align:center}
.clc-encabezado *{box-sizing:border-box}
.clc-encabezado h1{font-family:inherit;margin:0;line-height:1.2;font-size:clamp(32px,4.6vw,52px);font-weight:700;color:var(--azul);letter-spacing:-.5px}
.clc-encabezado .clc-intro{margin:14px auto 0;font-size:18px;font-weight:700;color:var(--texto);max-width:760px}
@media (max-width:600px){.clc-encabezado .clc-intro{font-size:16px}}
</style>

  <h1>Curso de Agente de Seguros</h1>
  <p class="clc-intro">Elige tu estado para ver los requisitos de la licencia de agente de seguros, las horas de prelicencia, el idioma del examen y el curso que necesitas para empezar a vender seguros.</p>
</section>
