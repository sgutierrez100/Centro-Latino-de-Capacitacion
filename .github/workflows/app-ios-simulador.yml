# Compila la app de iPhone para SIMULADOR (sin firma ni cuenta de Apple Developer).
# El resultado (CentroLatino-iOS-simulador.zip) se puede subir a appetize.io para probarla en el navegador.
name: App iPhone (simulador)

on:
  push:
    paths:
      - 'app/**'
      - '.github/workflows/app-ios-simulador.yml'
  workflow_dispatch:

jobs:
  simulador:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Elegir la versión más nueva de Xcode
        run: |
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          echo "Usando $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Instalar dependencias y sincronizar iOS
        run: |
          npm ci
          npx cap sync ios

      - name: Compilar para simulador
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Empaquetar
        run: |
          cd build/Build/Products/Debug-iphonesimulator
          ditto -c -k --sequesterRsrc --keepParent App.app "$GITHUB_WORKSPACE/CentroLatino-iOS-simulador.zip"
          ls -la "$GITHUB_WORKSPACE/CentroLatino-iOS-simulador.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: CentroLatino-iOS-simulador
          path: CentroLatino-iOS-simulador.zip
          retention-days: 30
